# Checks every pull request. "PR check" at the bottom is the one required
# status check (the main branch ruleset names it). No job here has AWS
# credentials, and none may: a pull request from a fork runs this workflow too.
name: PR checks

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Tool versions, spelled out only here (tests/repo/test_checks.py); deploy.yml spells
# the same SAM CLI. CLAUDE.md, the README and the pull request template name the same
# cfn-lint.
env:
  CFN_LINT_VERSION: '1.57.1'
  SAM_CLI_VERSION: '1.172.1'

# Named so every script runs with `-eo pipefail`.
defaults:
  run:
    shell: bash

jobs:
  python:
    name: Python
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: true
      - name: Install
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check . && uv run ruff format --check .
      - name: Type check
        run: uv run mypy
      - name: Tests (coverage floor in pyproject.toml)
        run: uv run pytest --cov --cov-report=term
      # A Dependabot uv update changes uv.lock only: regenerate the file on its branch.
      - name: Requirements match the lock
        run: |
          if ! { uv export --frozen --no-dev --no-emit-project -o src/requirements.txt && git diff --exit-code src/requirements.txt; }; then
            echo "::error file=src/requirements.txt::src/requirements.txt does not match uv.lock. Run 'uv export --frozen --no-dev --no-emit-project -o src/requirements.txt' and commit the result."
            exit 1
          fi

  infra:
    name: Templates
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
      - name: Lint the CloudFormation templates
        run: uvx "cfn-lint==${CFN_LINT_VERSION}" infra/*.yaml
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: .python-version
      - uses: aws-actions/setup-sam@341eee193f458fa5aae5d52c94b0c5cf3a1c5a52 # v3
        with:
          version: ${{ env.SAM_CLI_VERSION }}
          use-installer: true
      # Both run without AWS credentials: --lint checks the template locally.
      - name: Validate the app template
        run: sam validate --lint -t infra/app.yaml --region us-east-2
      - name: Build the functions
        run: sam build -t infra/app.yaml

  pr-check:
    name: PR check
    if: ${{ !cancelled() }}
    needs: [python, infra]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Summarize
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Job results: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != success ]; then exit 1; fi
          done
