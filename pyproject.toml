[project]
name = "asmbly-ceramics"
version = "0.1.0"
description = "Asmbly Makerspace's ceramics studio: drop-offs, kiln loads and firings"
requires-python = ">=3.14,<3.15"
# No runtime dependencies yet: the app comes with the plan for epic #1. Add what it
# needs with `uv add`, never by editing uv.lock.
dependencies = []

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

# The app is a package under src/, installed into the environment by `uv sync`, so
# tests import it the way the app will.
[build-system]
requires = ["uv_build>=0.12.0,<0.14"]
build-backend = "uv_build"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "B",     # bugbear
    "C4",    # comprehensions
    "DTZ",   # timezone-naive datetimes
    "E",
    "F",
    "I",     # import sorting
    "N",     # naming
    "PT",    # pytest style
    "RUF",
    "S",     # bandit security checks
    "SIM",
    "TID",   # tidy imports (bans relative imports below)
    "UP",    # pyupgrade
    "W",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.mypy]
python_version = "3.14"
strict = true
explicit_package_bases = true
# tests/repo/test_checks.py fails if a folder of Python isn't listed.
files = ["src", "tests"]
mypy_path = "src"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"

[tool.coverage.run]
# What the floor measures: the app, and the tests themselves, which catches a check
# whose body never runs (a parametrized test with nothing to iterate over).
source = ["src", "tests"]
branch = true

[tool.coverage.report]
# A floor, not a target: raise it as coverage grows, never lower it.
fail_under = 90
show_missing = true
skip_covered = true
